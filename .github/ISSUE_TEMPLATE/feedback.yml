name: "Website audit feedback"
description: "Tell us how LaunchScope worked on a website you are authorized to check."
title: "[Feedback] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing LaunchScope Open! Please don't submit secrets, passwords, private URLs, or personal data.
        We only perform lightweight public-page checks; do not treat the score as a security certification.
  - type: dropdown
    id: experience
    attributes:
      label: Overall experience
      description: How useful was the report?
      options:
        - Very useful
        - Somewhat useful
        - Not useful yet
        - I could not complete an audit
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Android phone
        - iPhone / iPad
        - Desktop / laptop
        - Other
    validations:
      required: true
  - type: textarea
    id: worked
    attributes:
      label: What worked well?
      description: Mention anything that helped you understand the results.
  - type: textarea
    id: improve
    attributes:
      label: What would you improve first?
      placeholder: "For example: clearer recommendations, screenshot export, mobile layout..."
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I have not included passwords, API keys, private URLs or other sensitive data.
          required: true
